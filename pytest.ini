[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test

# Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output: verbose, short tracebacks, no header noise
addopts =
    -v
    --tb=short
    --strict-markers

# Register project markers so pytest doesn't warn on unknown marks
markers =
    unit: Pure unit test — no database, no I/O (fast).
    integration: Integration test — hits the real DB and/or external services.
    slow: Test that is intentionally slow (e.g. full flow end-to-end).
